<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>testing position</title>
    <style>
        .container {
            width: 300px;
            height: 1000px;
        }

        .lorem{
            background-color: coral;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>




</head>
<body>
    <div class="container">
        <div class="lorem">
            <p>
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Etiam lacinia ante id sapien auctor, in euismod elit tristique. Suspendisse nibh risus, interdum at neque eget, fringilla convallis magna
            </p>
        </div>
    </div>
</body>
</html>
