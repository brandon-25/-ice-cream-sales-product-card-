<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the email list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #08090a;
      --panel: #0e0f11;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f7f8f8;
      --muted: #8a8f98;
      --accent: #5e6ad2;
      --accent-hover: #6872e5;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient glow */
    body::before {
      content: "";
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 900px;
      background: radial-gradient(
        circle,
        rgba(94, 106, 210, 0.18) 0%,
        rgba(94, 106, 210, 0) 60%
      );
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      text-align: center;
      animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(160deg, #5e6ad2, #3a44a8);
      box-shadow: 0 8px 30px rgba(94, 106, 210, 0.35);
      margin-bottom: 28px;
    }

    .logo svg {
      width: 26px;
      height: 26px;
      color: #fff;
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 380px;
      margin: 0 auto 32px;
    }

    form {
      display: flex;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    form:focus-within {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 4px rgba(94, 106, 210, 0.12);
    }

    input[type="email"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      padding: 0 14px;
    }

    input[type="email"]::placeholder {
      color: #5b6068;
    }

    button {
      flex-shrink: 0;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      padding: 11px 20px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #6a6f78;
    }

    .success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      animation: rise 0.4s ease both;
    }

    .success.show {
      display: flex;
    }

    .success .check {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(94, 106, 210, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .success p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .success strong {
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 26px;
      }
      form {
        flex-direction: column;
        gap: 6px;
      }
      input[type="email"] {
        padding: 12px 14px;
      }
      button {
        width: 100%;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
        <polyline points="22,6 12,13 2,6" />
      </svg>
    </div>

    <h1>Join the email list</h1>
    <p class="subtitle">
      Get product updates, behind-the-scenes notes, and the occasional good
      idea delivered straight to your inbox. No spam, ever.
    </p>

    <form id="signup" novalidate>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      />
      <button type="submit">Subscribe</button>
    </form>

    <p class="note">Join 2,000+ subscribers. Unsubscribe anytime.</p>

    <div class="success" id="success">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
          stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </div>
      <p>You're on the list! Check <strong id="confirmEmail">your inbox</strong>
        to confirm your subscription.</p>
    </div>
  </main>

  <script>
    const form = document.getElementById("signup");
    const success = document.getElementById("success");
    const emailInput = document.getElementById("email");
    const confirmEmail = document.getElementById("confirmEmail");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = emailInput.value.trim();
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      if (!valid) {
        form.style.borderColor = "#e5484d";
        form.style.boxShadow = "0 0 0 4px rgba(229, 72, 77, 0.12)";
        emailInput.focus();
        return;
      }

      // Hook up your provider here (e.g. POST to your form/API endpoint).
      confirmEmail.textContent = email;
      form.style.display = "none";
      document.querySelector(".note").style.display = "none";
      success.classList.add("show");
    });

    emailInput.addEventListener("input", function () {
      form.style.borderColor = "";
      form.style.boxShadow = "";
    });
  </script>
</body>
</html>
